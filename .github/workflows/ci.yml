name: CI

on:
  # Post-submit validation of every commit that lands on the default branch.
  push:
    branches:
      - main
  # Presubmit validation of pull requests.
  pull_request:
  # Allows a missed or failed post-submit run to be started manually.
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main-branch push needs post-submit validation. Pull request
# runs use separate groups and are not cancelled by subsequent commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'post-submit' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo +stable test --all-targets --locked

  lint:
    name: Formatting, Clippy, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Check package
        run: cargo +stable package --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo +1.88 check --all-targets --locked
